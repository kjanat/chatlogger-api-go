run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: true

  gocyclo:
    min-complexity: 10

  gofmt:
    simplify: true

  goimports:
    local-prefixes: github.com/kjanat/chatlogger-api-go

  govet:
    enable-all: true
    disable:
      - fieldalignment

  lll:
    line-length: 120

  misspell:
    locale: US

  staticcheck:
    checks: ["all"]

  stylecheck:
    checks: ["all", "-ST1000", "-ST1003", "-ST1016", "-ST1020", "-ST1021", "-ST1022"]

  gosec:
    excludes:
      - G404 # Use of weak random number generator - okay for test fixtures

  revive:
    rules:
      - name: exported
        disabled: true
      - name: package-comments
        disabled: true

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - typecheck
    - unused
    - gocyclo
    - gofmt
    - goimports
    - misspell
    - lll
    - goconst
    - gosec
    - unconvert
    - unparam
    - revive
    - bodyclose
    - rowserrcheck
    - exportloopref
    - whitespace
    - goprintffuncname
    - gomnd
    - gocritic

  disable:
    - deadcode
    - varcheck
    - structcheck

issues:
  exclude-rules:
    # Exclude some linters from running on tests files
    - path: _test\.go
      linters:
        - gocyclo
        - errcheck
        - dupl
        - gosec
        - gomnd

    # Exclude test files from certain checks
    - path: test/
      linters:
        - gomnd
        - goconst

    # Exclude migration files from linting
    - path: migrations/
      linters:
        - lll

    # Allow long lines in generated files
    - path: docs/
      linters:
        - lll

  max-issues-per-linter: 0
  max-same-issues: 0